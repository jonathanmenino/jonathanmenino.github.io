      valor: 0 ms no celular e no desktop
      texto: "Nenhum script trava a página: o visitante rola e toca sem esperar."
    - rotulo: Cumulative Layout Shift
      valor: 0 no celular · 0,005 no desktop
      texto: Nada muda de lugar enquanto a página carrega, então ninguém toca no botão errado.
  observacao: Notas medidas no PageSpeed Insights em 13/10/2026.
  otimizacoes: false
